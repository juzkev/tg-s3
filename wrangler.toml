name = "tg-s3"
main = "src/index.ts"
compatibility_date = "2026-03-15"
workers_dev = true
preview_urls = false

[vars]
S3_REGION = "us-east-1"
# Parallel per-chunk consolidations when completing a >2GB multipart upload.
# Default "1" (sequential). Higher values speed up multi-chunk completion but run
# that many <=2GB VPS temp files / Telegram transfers at once (clamped to 8).
# CHUNK_CONSOLIDATE_CONCURRENCY = "3"

[[d1_databases]]
binding = "DB"
database_name = "tg-s3-db"
database_id = ""
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CACHE"
bucket_name = "tg-s3-cache"

[triggers]
crons = ["0 */6 * * *"]  # Every 6 hours: 8 cleanup tasks (expired/orphaned shares, stale multiparts, D1-TG consistency, R2 cache, password locks, orphaned chunks, lifecycle expiration)
